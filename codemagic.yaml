workflows:
  react-native-android:
    name: React Native Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android folder if missing
        script: |
          # Se Manus ha usato Expo, genera la cartella Android nativa automaticamente
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --clean
          fi
      - name: Fix execution permissions
        script: |
          # Forza i permessi di esecuzione per evitare blocchi del server
          cd android && chmod +x gradlew
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
