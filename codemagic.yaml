workflows:
  react-native-android:
    name: React Native Android APK Release Fix
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --clean
          fi
      - name: Fix signing configurations
        script: |
          # Forza Android a usare la chiave di debug anche per la versione release, evitando l'errore
          sed -i '' 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
      - name: Fix execution permissions
        script: |
          cd android && chmod +x gradlew
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
