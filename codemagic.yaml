workflows:
  react-native-android:
    name: React Native Android Autonomous APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --clean
          fi
      - name: Build Standalone JS Bundle
        script: |
          # Questo comando forza l'inserimento di tutta la logica dentro l'app prima di compilarla
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || true
      - name: Fix execution permissions
        script: |
          cd android && chmod +x gradlew
      - name: Build Android APK
        script: |
          # Usiamo assembleDebug che non richiede chiavi digitali
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
